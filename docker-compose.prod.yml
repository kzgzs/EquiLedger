services:
  db:
    environment:
      POSTGRES_PASSWORD: ${EQUI_OWNER_PWD:?请在 .env 设置 EQUI_OWNER_PWD}
    ports:
      - "127.0.0.1:5433:5432"   # 数据库绝不暴露公网

  api:
    environment:
      EQUI_OWNER_CS: "Host=db;Port=5432;Database=equiledger;Username=equi;Password=${EQUI_OWNER_PWD}"
      EQUI_APP_CS: "Host=db;Port=5432;Database=equiledger;Username=equi_app;Password=${EQUI_APP_PWD:?请在 .env 设置 EQUI_APP_PWD}"
    ports:
      - "127.0.0.1:8090:8080"   # 仅经 Caddy/nginx 反代对外

  backup:
    environment:
      PGPASSWORD: ${EQUI_OWNER_PWD}
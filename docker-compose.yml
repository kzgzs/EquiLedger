# 商业授权条件：保留本署名。移除/篡改署名即授权终止并构成侵权。
services:
  db:
    image: postgres:16-alpine
    container_name: equiledger-db
    environment:
      POSTGRES_USER: equi
      POSTGRES_PASSWORD: equi_owner_pwd
      POSTGRES_DB: equiledger
    ports:
      - "5433:5432"
    volumes:
      - equi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equi -d equiledger"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: equiledger-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      EQUI_PG_HOST: db
      EQUI_PG_PORT: "5432"
      EQUI_PG_DB: equiledger
      EQUI_WEBHOOK_URL: "${EQUI_WEBHOOK_URL:-}"
      EQUI_WOO_SECRET: "${EQUI_WOO_SECRET:-}"
      EQUI_PAYROLL_AUTO: "${EQUI_PAYROLL_AUTO:-1}"
      EQUI_PAYROLL_DAY: "${EQUI_PAYROLL_DAY:-}"
      EQUI_LICENSE_SERVER: "${EQUI_LICENSE_SERVER:-https://sz.djkz.top}"
      EQUI_LICENSE_API_KEY: "${EQUI_LICENSE_API_KEY:-}"
      EQUI_LICENSE_KEY: "${EQUI_LICENSE_KEY:-}"
      EQUI_LICENSE_DOMAIN: "${EQUI_LICENSE_DOMAIN:-}"
      EQUI_LICENSE_ENFORCE: "${EQUI_LICENSE_ENFORCE:-0}"
      EQUI_LICENSE_GRACE_DAYS: "${EQUI_LICENSE_GRACE_DAYS:-7}"
      EQUI_EVIDENCE_DIR: /data/evidence
    ports:
      - "8090:8080"
    volumes:
      - equi_evidence:/data/evidence
      - equi_license:/data/license
    restart: unless-stopped

  # 可选：自动加密备份到自定义目录/NAS。启用方式见《唯一全面操作教程.md》§10.4
  # 不设置 profile 时本服务完全不启动、不占资源。
  backup:
    build:
      context: .
      dockerfile: scripts/Dockerfile.backup
    container_name: equiledger-backup
    profiles: ["backup"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: equi_owner_pwd
      EQUI_BACKUP_PASSPHRASE: "${EQUI_BACKUP_PASSPHRASE:-}"
      EQUI_BACKUP_INTERVAL_MIN: "${EQUI_BACKUP_INTERVAL_MIN:-1440}"
      EQUI_BACKUP_KEEP: "${EQUI_BACKUP_KEEP:-30}"
    volumes:
      - "${EQUI_BACKUP_DIR:-./backups}:/backup"
      - equi_evidence:/evidence:ro
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    restart: unless-stopped

volumes:
  equi_pgdata:
  equi_evidence:
  equi_license: